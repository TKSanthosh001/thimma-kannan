[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/googlefe5b13cb88557756.html"
  to = "/googlefe5b13cb88557756.html"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
